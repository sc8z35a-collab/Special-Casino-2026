# Render (https://render.com) blueprint: Dashboard > New > Blueprint, pick this
# repository, done. The disk keeps the player database across deploys.
services:
  - type: web
    name: blockbuster-reels
    runtime: docker
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /api/health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_REQUESTS
        value: "0"
    disk:
      name: game-data
      mountPath: /data
      sizeGB: 1
