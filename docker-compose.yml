# One server (VPS) setup: the game server behind Caddy, which takes care of HTTPS.
#   1. cp .env.example .env   and write your domain into DOMAIN
#   2. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
      DATA_DIR: /data
    volumes:
      - game-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?write DOMAIN=your.domain into .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  game-data:
  caddy-data:
  caddy-config:
