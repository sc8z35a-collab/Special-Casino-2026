<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>TWO STATE サーバー運営サイト</title>
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="ops.css">
</head>
<body>

<!-- the first time: the operator's name and password -->
<main class="login" id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on" novalidate>
    <div class="brand"><span class="brand-mark">TS</span><span>TWO STATE</span></div>
    <h1>サーバー運営サイト</h1>
    <p class="muted">運営者のアカウントだけがログインできます。名前とパスワードの入力は最初の1回だけです。</p>
    <label class="field"><span>名前</span><input id="login-name" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="field"><span>パスワード</span><input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn primary wide" type="submit" id="login-go">ログイン</button>
  </form>
</main>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><span class="brand-mark">TS</span><span>TWO STATE</span><small>サーバー運営</small></div>
    <div class="top-right">
      <span class="muted" id="op-name"></span>
      <button class="btn ghost small" id="logout" type="button">ログアウト</button>
    </div>
  </header>

  <section class="summary">
    <div class="stat"><span>登録プレイヤー</span><b id="sum-total">-</b></div>
    <div class="stat"><span>オンライン</span><b id="sum-online">-</b></div>
    <div class="stat"><span>処分中</span><b id="sum-banned">-</b></div>
    <div class="stat"><span>最終更新</span><b id="sum-at">-</b></div>
  </section>

  <section class="toolbar">
    <input class="search" id="search" type="search" placeholder="プレイヤー名で探す" autocomplete="off" spellcheck="false">
    <div class="chips" id="filters">
      <button class="chip on" data-filter="all" type="button">すべて</button>
      <button class="chip" data-filter="online" type="button">オンライン</button>
      <button class="chip" data-filter="banned" type="button">処分中</button>
    </div>
    <label class="sort"><span>並び順</span>
      <select id="sort">
        <option value="new">登録が新しい順</option>
        <option value="worth">資産が多い順</option>
        <option value="seen">最近遊んだ順</option>
        <option value="play">遊んだ時間が長い順</option>
      </select>
    </label>
  </section>

  <section class="table-wrap">
    <table class="players">
      <thead>
        <tr><th>プレイヤー</th><th>オンライン状況</th><th class="num">資産</th><th>引き継ぎコード</th><th>パスワード</th><th>処分</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty muted" id="empty" hidden>該当するプレイヤーはいません</p>
  </section>
</div>

<!-- one player's details and the actions -->
<div class="drawer-back" id="drawer-back" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="プレイヤーの詳細">
  <button class="close" id="drawer-close" type="button" aria-label="閉じる">×</button>
  <div id="detail"></div>
</aside>

<!-- confirmations and inputs -->
<div class="dialog-back" id="dialog" hidden>
  <form class="dialog" id="dialog-form" novalidate>
    <h2 id="dialog-title"></h2>
    <p class="muted" id="dialog-text"></p>
    <label class="field" id="dialog-field" hidden><span id="dialog-label"></span><input id="dialog-input" type="text" autocomplete="off"></label>
    <p class="error" id="dialog-error" role="alert"></p>
    <div class="dialog-acts">
      <button class="btn ghost" type="button" id="dialog-cancel">やめる</button>
      <button class="btn primary" type="submit" id="dialog-ok"></button>
    </div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script src="ops.js"></script>
</body>
</html>
