<!doctype html>
<meta charset="utf-8">
<title>3D preview loader check</title>
<h1>3D preview loader check</h1>
<p>Uses the game's actual GLTFLoader, decoder and browser image decoding. No WebGL context required.</p>
<pre id="result">Checking…</pre>
<script src="/js/vendor/three-bundle.js"></script>
<script>
(async () => {
  const rows = [], result = document.getElementById('result');
  for (const name of ['seed', 'preview']) {
    const url = '/img/3d/tree/' + name + '.glb', response = await fetch(url);
    if (!response.ok) throw new Error(url + ': HTTP ' + response.status);
    const bytes = await response.arrayBuffer();
    const gltf = await new BR3D.GLTFLoader().setMeshoptDecoder(BR3D.MeshoptDecoder).parseAsync(bytes, '/');
    let triangles = 0, maxTexture = 0;
    const textures = new Set();
    gltf.scene.traverse(node => {
      if (!node.isMesh) return;
      triangles += (node.geometry.index?.count || node.geometry.attributes.position.count) / 3;
      for (const material of Array.isArray(node.material) ? node.material : [node.material]) {
        for (const value of Object.values(material)) if (value?.isTexture) textures.add(value);
      }
    });
    for (const texture of textures) {
      const image = texture.image;
      if (!image || !(image.width > 0 && image.height > 0)) throw new Error(url + ': image decode failed');
      maxTexture = Math.max(maxTexture, image.width, image.height);
    }
    if (!(bytes.byteLength <= 300000 && triangles > 0 && triangles <= 8000 && maxTexture <= 512)) throw new Error(url + ': preview budget');
    rows.push('PASS ' + url + ': ' + bytes.byteLength + ' bytes, ' + triangles + ' triangles, ' + textures.size + ' decoded textures, max ' + maxTexture + 'px');
  }
  result.textContent = rows.join('\n') + '\nAll preview assets loaded successfully.';
  result.dataset.status = 'pass';
})().catch(error => {
  document.getElementById('result').textContent = 'FAIL ' + error.message;
  document.getElementById('result').dataset.status = 'fail';
  console.error(error);
});
</script>
